[theme]
primaryColor = "#6366F1"
backgroundColor = "#090D16"
secondaryBackgroundColor = "#0F172A"
textColor = "#F8FAFC"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 500

[client]
showErrorDetails = false
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
